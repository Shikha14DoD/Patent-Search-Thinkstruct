# PostgreSQL for the Part 2 proof of concept (see poc/README.md).
#   Start:  docker compose up -d
#   Stop:   docker compose down        (add -v to also delete the data)
services:
  postgres:
    image: postgres:16.6
    environment:
      POSTGRES_USER: poc
      POSTGRES_PASSWORD: poc
      POSTGRES_DB: patents_poc
    ports:
      # Host port 5433, so it can't clash with a Postgres already installed on 5432.
      - "5433:5432"
    volumes:
      - poc_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U poc -d patents_poc"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  poc_data:
